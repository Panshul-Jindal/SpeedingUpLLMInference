# Study-wide settings. Profiles (configs/profiles/*.yaml) deep-merge their `overrides:` on top of this file.
seed: 20261029

# Main regime levels (tentative, spec section 6.1). Exactly one regime varies at a time; the others stay at mid.
regimes:
  context: {low: 256, mid: 2048, high: 8192}        # prompt tokens
  concurrency: {low: 2, mid: 32, high: 128}         # in-flight requests (closed loop)
  reuse: {low: 0.0, mid: 0.5, high: 0.9}            # share of requests that start with a pooled prefix

workload:
  source: synthetic            # extension point: sharegpt | longdoc (not implemented in this phase)
  output_tokens: 256           # max_tokens == min_tokens, ignore_eos
  prefix_pool_size: 4
  prefix_fraction: 0.75        # share of the prompt taken by the pooled prefix
  trace_requests: 6000         # requests per trace (warm-up + window); the driver warns if it wraps

gates:
  p99_tpot_ms: 100.0
  p99_ttft_ms: 5000.0
  max_accuracy_drop: 1.0       # points, per quality task, vs Default

run:
  reps: 3
  warmup_s: 30.0
  window_s: 120.0
  startup_timeout_s: 1200.0
  request_timeout_s: 900.0
  gpu_release_timeout_s: 120.0
  telemetry_interval_s: 1.0
  reset_prefix_cache_between_reps: true

# Off state of optimization 6. vLLM 0.31 accepts --no-enable-chunked-prefill; the 16,384-token budget is
# also passed so prompts are never split even if the engine keeps chunking enabled internally.
chunked_prefill_off:
  disable_flag: true
  budget_tokens: 16384

# "On" values used until a sweep has written configs/tuned.yaml. Runs using them are marked untuned.
placeholders:
  max_num_seqs: 128
  max_num_batched_tokens: 2048
  parallel_layout: tp2x2

sweeps:
  max_num_seqs: [16, 32, 64, 128, 256]
  max_num_batched_tokens: [512, 1024, 2048, 4096]
  # Layout grammar: tp<T>[pp<P>][x<R>]  (R independent replicas, each T*P GPUs). Main machine only.
  parallel_layout: [tp4, tp2x2, tp1x4, tp2pp2]
  reps: 1

quality:
  tasks: [gsm8k, mmlu, humaneval]
  # MMLU subset (lm-eval task names); averaged with equal weight.
  mmlu_subtasks: [mmlu_high_school_mathematics, mmlu_college_computer_science, mmlu_high_school_physics,
                  mmlu_professional_medicine, mmlu_high_school_us_history, mmlu_philosophy,
                  mmlu_econometrics, mmlu_clinical_knowledge]
  metrics:
    gsm8k: "exact_match,strict-match"
    humaneval: "pass@1,create_test"
    mmlu: "acc,none"
  limit: null                  # per-task sample limit; null = full task
  num_concurrent: 16
  agreement_prompts: data/agreement_prompts_v1.jsonl
  agreement_max_tokens: 128
  mmlu_backend: auto           # auto (server, then offline vllm fallback) | server | offline

analysis:
  kv_usage_threshold: 0.90
  bandwidth_fraction_threshold: 0.70
  compute_fraction_threshold: 0.60
  no_benefit_gain: 0.02
