[project]
name = "harness"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
description = "Benchmarking harness for the LLM serving optimization study"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["tokenizer: needs a HF tokenizer download (skipped offline)"]
